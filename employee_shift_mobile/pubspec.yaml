name: employee_shift_mobile
description: "AI ShiftMaster - Çalışan Vardiya Yönetim Uygulaması"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # State Management
  provider: ^6.1.2
  
  # Network & API
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3
  
  # Local Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
  sqflite: ^2.3.3+1
  path: ^1.9.0
  
  # Push Notifications
  firebase_messaging: ^15.0.4
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  
  # Utilities
  intl: ^0.19.0
  jwt_decoder: ^2.0.1
  go_router: ^14.2.3
  
  # Animations
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
